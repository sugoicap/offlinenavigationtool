name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project (unzip OfflineNav.zip if it was uploaded as zip)
        run: |
          if [ -f OfflineNav.zip ]; then
            unzip -q -o OfflineNav.zip
            echo "PROJECT=OfflineNav" >> "$GITHUB_ENV"
          else
            echo "PROJECT=." >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        working-directory: ${{ env.PROJECT }}
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineNav-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/release/*.apk
